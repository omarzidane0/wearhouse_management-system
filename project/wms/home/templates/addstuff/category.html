{% extends 'base/index.html' %}
{% load static %}

{% block style %}
<style>
/* ===== Base fixes for this page only ===== */
.categories-page {
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #e0f7fa, #e8f5e9);
  margin: 0;
  padding: 20px; /* أقل من 40px للموبايل */
  box-sizing: border-box;
  overflow-x: hidden; /* منع السكرول الأفقي */
}

.categories-page h1 {
  text-align: center;
  color: #2e7d32;
  font-size: 2.5em;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.categories-page .container {
  max-width: 650px;
  margin: auto;
  background: #fff;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.categories-page .container:hover {
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
}

.categories-page .category-list {
  margin: 20px 0 30px;
  padding: 0;
  list-style: none;
}

.categories-page .category-list li {
  background: #f1f8e9;
  margin: 8px 0;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 1.1em;
  color: #33691e;
  font-weight: 500;
  transition: 0.2s;
}

.categories-page .category-list li:hover {
  background: #dcedc8;
  transform: translateX(5px);
}

.categories-page form {
  display: flex;
  gap: 12px;
  flex-wrap: wrap; /* يخلي العناصر تنزل تحت بعض على الموبايل */
}

.categories-page input[type="text"] {
  flex: 1 1 100%; /* ياخد عرض كامل على الموبايل */
  padding: 12px 15px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 1em;
  outline: none;
  transition: 0.2s;
}

.categories-page input[type="text"]:focus {
  border-color: #4caf50;
  box-shadow: 0 0 5px rgba(76, 175, 80, 0.4);
}

.categories-page button {
  flex: 1 1 100%; /* ياخد عرض كامل على الموبايل */
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #66bb6a, #43a047);
  color: white;
  font-size: 1em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(67,160,71,0.3);
  transition: all 0.3s ease;
}

.categories-page button:hover {
  background: linear-gradient(135deg, #43a047, #2e7d32);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(67,160,71,0.5);
}

.loading {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: rgba(255,255,255,0.9);
  padding: 20px 40px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  font-size: 18px;
  color: #28a745;
  z-index: 1000;
}

#alert-msg-ph {
  display: none; 
  color: #b91c1c; 
  background: #fee2e2; 
  padding: 10px 14px; 
  border-radius: 8px; 
  font-size: 14px; 
  margin-bottom: 12px;
}

/* Responsive adjustments */
@media (max-width: 600px) {
  .categories-page .container {
    padding: 20px;
  }
  .categories-page input[type="text"],
  .categories-page button {
    flex: 1 1 100%;
  }
}
</style>
{% endblock style %}

{% block Content %}
<div class="categories-page">
  <div class="loading" id="loading">جاري التحميل...</div>
  <div class="container">
    <h1>📂 Categories</h1>
    <ul class="category-list" id="categoryList"></ul>

    <form id="categoryForm">
      {% csrf_token %}
      <input type="text" id="categoryInput" placeholder="Enter new category" required>
      <button type="submit">➕ Add</button>
    </form>

    <br><br>
    <div id="alert-msg-ph"></div>
  </div>
</div>
{% endblock Content %}

{% block scripts %}
<script src="{% static 'js/add_category.js'%}"></script>
{% endblock scripts %}
