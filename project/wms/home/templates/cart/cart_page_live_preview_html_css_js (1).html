<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>صفحة السلة — عرض مباشر</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --muted:#64748b;
      --accent:#2563eb;
      --danger:#ef4444;
      --radius:12px;
      --gap:16px;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Naskh Arabic', Arial, sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#0f172a;padding:16px}

    header{display:flex;flex-direction:column;align-items:center;margin-bottom:16px;gap:6px;text-align:center}
    header h1{font-size:22px;margin:0}
    header div{color:var(--muted);font-size:14px}

    .cartpage-container{display:flex;flex-direction:row;gap:24px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
    section.cartpage-products{flex:1 1 400px;min-width:280px}
    .cartpage-products-list{display:flex;flex-direction:column;gap:12px}

    .cartpage-product{background:var(--card);border-radius:var(--radius);display:flex;padding:12px;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(15,23,42,0.06);flex-wrap:wrap}
    .cartpage-thumb{width:96px;height:72px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,#e2e8f0,#c7d2fe);display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
    .cartpage-meta{flex:1 1 150px;min-width:0}
    .cartpage-meta h3{margin:0 0 6px 0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cartpage-meta p{margin:0;font-size:13px;color:var(--muted)}
    .cartpage-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;width:100%}
    .cartpage-qty{display:inline-flex;align-items:center;border-radius:8px;overflow:hidden;background:#f1f5f9}
    .cartpage-qty button{border:0;background:transparent;padding:8px 10px;cursor:pointer;font-weight:700}
    .cartpage-qty input{width:40px;border:0;text-align:center;padding:6px 4px;background:transparent}
    .cartpage-remove{background:transparent;border:0;color:var(--danger);cursor:pointer;font-size:13px}

    .cartpage-summary{background:var(--card);padding:18px;border-radius:14px;box-shadow:0 8px 30px rgba(2,6,23,0.08);flex:0 0 300px;min-width:260px}
    .cartpage-summary h2{margin:0 0 8px 0;font-size:18px}
    .cartpage-checkout{display:block;margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;text-align:center;font-weight:700}

    #cartpage-clear{padding:10px;border-radius:8px;border:0;cursor:pointer;background:#fee2e2;color:var(--danger);margin-top:12px}

    @media (max-width:768px){
      .cartpage-container{flex-direction:column;align-items:center;gap:16px}
      .cartpage-summary{width:100%;flex:1 1 auto}
      .cartpage-product{flex-direction:column;align-items:flex-start}
      .cartpage-actions{align-items:flex-start;width:100%}
    }
  </style>
</head>
<body>
  <header>
    <h1>سلة التسوق</h1>
    <div>عرض مباشر — جرّب تعديل الكميات وإزالة المنتجات</div>
  </header>

  <main class="cartpage-container">
    <section class="cartpage-products">
      <div class="cartpage-products-list" id="products"></div>
      <button id="cartpage-clear">إفراغ السلة</button>
    </section>

    <aside class="cartpage-summary" id="cartPanel">
      <h2>ملخص الطلب</h2>
      <div id="cartItemsBrief" style="width:100%"></div>
      <a href="#" class="cartpage-checkout" id="checkoutBtn">إتمام الطلب</a>
    </aside>
  </main>

  <template id="productTpl">
    <article class="cartpage-product">
      <div class="cartpage-thumb">IMG</div>
      <div class="cartpage-meta">
        <h3 class="title">عنوان المنتج</h3>
        <p class="desc">وصف قصير للمنتج أو مواصفاته</p>
      </div>
      <div class="cartpage-actions">
        <div style="display:flex;gap:8px;align-items:center">
          <div class="cartpage-qty">
            <button class="dec">−</button>
            <input class="qVal" type="number" min="1" value="1" readonly />
            <button class="inc">+</button>
          </div>
          <button class="cartpage-remove">إزالة</button>
        </div>
      </div>
    </article>
  </template>

  <script>
    const sample = [
      {id:1,name:'كابل شحن سريع',desc:'طول 1.5م، متوافق مع كل الأجهزة'},
      {id:2,name:'سماعة بلوتوث',desc:'عمر البطارية 20 ساعة'},
      {id:3,name:'حافظة مرنة',desc:'مقاومة للصدمات'}
    ];

    const productsEl = document.getElementById('products');
    const productTpl = document.getElementById('productTpl');

    function renderProducts(){
      productsEl.innerHTML='';
      sample.forEach(p=>{
        const node = productTpl.content.cloneNode(true);
        node.querySelector('.title').textContent = p.name;
        node.querySelector('.desc').textContent = p.desc;
        const qInput = node.querySelector('.qVal');
        const remove = node.querySelector('.cartpage-remove');
        const thumb = node.querySelector('.cartpage-thumb');
        thumb.textContent = p.name.split(' ')[0];
        qInput.value = 1;
        remove.addEventListener('click',()=>{ node.remove(); });
        productsEl.appendChild(node);
      });
    }

    renderProducts();

    document.getElementById('cartpage-clear').addEventListener('click',()=>{ productsEl.innerHTML=''; });
    document.getElementById('checkoutBtn').addEventListener('click',(e)=>{ e.preventDefault(); alert('تم تقديم الطلب'); });
  </script>
</body>
</html>
