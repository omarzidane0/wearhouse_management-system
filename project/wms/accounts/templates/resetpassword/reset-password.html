{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Forgot Password • Neo Green</title>
  <style>
    :root {
     
      --primary: #22c55e; --primary-2: #16a34a; --accent: #6ee7b7;
      --card: rgba(255,255,255,.06); --glass: rgba(255,255,255,.10);
      --border: rgba(255,255,255,.12); --ring: rgba(34,197,94,.35);
      --shadow: 0 10px 25px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.05);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f7f6; --bg-2: #eaf3ee; --fg: #0b1324; --muted: #5b6b7b;
        --card: rgba(255,255,255,.65); --glass: rgba(255,255,255,.7);
        --border: rgba(15,23,42,.10); --shadow: 0 12px 30px rgba(2,6,23,.08), inset 0 1px 0 rgba(255,255,255,.45);
      }
    }
    * { box-sizing: border-box } html, body { height: 100% }
    body {
      margin: 0;
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(60% 80% at 10% 10%, #22c55e20, transparent 60%), radial-gradient(70% 90% at 90% 5%, #16a34a14, transparent 65%), linear-gradient(180deg, var(--bg), var(--bg-2));
      overflow-x: hidden;
    }
    .grid { min-height: 100vh; display: grid; grid-template-columns: 1fr }
    @media (max-width: 1024px) { .grid { grid-template-columns: 1fr } }
    .left { display: none; } /* Hide the left side in portrait mode */
    .right { display: grid; place-items: center; padding: 56px 24px; position: relative }
    .card { width: min(400px, 92vw); border: 1px solid var(--border); border-radius: 28px; background: linear-gradient(180deg, var(--glass), rgba(255,255,255,.06)); box-shadow: var(--shadow); backdrop-filter: blur(14px) saturate(120%); -webkit-backdrop-filter: blur(14px) saturate(120%); overflow: hidden; }
    .header { text-align: center; padding: 26px 26px 10px }
    .badge { display: inline-flex; gap: 6px; align-items: center; padding: 8px 12px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; background: rgba(34,197,94,.12); color: #bff8d7; border: 1px solid rgba(34,197,94,.35); border-radius: 999px; }
    .av { width: 96px; height: 96px; margin: 14px auto 6px; border-radius: 50%; background: radial-gradient(100% 100% at 30% 30%, #c6f6d5, #9ae6b4); position: relative; display: grid; place-items: center; box-shadow: 0 14px 28px rgba(0,0,0,.18); }
    h1 { margin: 8px 0 2px; font-size: 30px; letter-spacing: .3px }
    .sub { margin: 0; color: var(--muted) }
    .form { padding: 20px 24px 26px; display: grid; gap: 14px }
    .label { font-size: 13px; opacity: .9 }
    .field { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px; background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06)); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); transition: box-shadow .2s, border-color .2s, transform .08s ease; }
    .field:focus-within { outline: 4px solid var(--ring); border-color: var(--accent); transform: translateY(-1px) }
    .field input { flex: 1; background: transparent; border: none; outline: none; color: var(--fg); font-size: 15px; }
    .btn { margin-top: 6px; padding: 14px 18px; border: none; border-radius: 999px; font-weight: 900; letter-spacing: .3px; background: linear-gradient(180deg, var(--primary), var(--primary-2)); color: #06110b; text-shadow: 0 1px 0 rgba(255,255,255,.35); box-shadow: 0 18px 40px rgba(34,197,94,.35), inset 0 1px 0 rgba(255,255,255,.6); cursor: pointer; position: relative; overflow: hidden; }
    .btn::before { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.45) 40%, transparent 60%); transform: translateX(-120%); transition: transform .6s ease; }
    .btn:hover::before { transform: translateX(120%) } .btn:active { transform: translateY(1px) }
    #alert-msg{
  display:none; 
  color:#b91c1c; 
  background:#fee2e2; 
  padding:10px 14px; 
  border-radius:8px; 
  font-size:14px; 
  margin-bottom:12px;
}
  </style>
</head>
<body>
  <div class="grid">
    <section class="left" aria-hidden="true">
      <div class="blob"></div>
      <div class="leaf one"></div>
      <div class="leaf two"></div>
      <div class="leaf three"></div>
    </section>
    <section class="right" role="region" aria-labelledby="forgot">
      <div class="card">
        <div class="header">
          <span class="badge" style="color: white;">        </span>

        
          <h1 id="forgot">Forgot Password</h1>
          <p class="sub">Enter your email to reset your password</p>
        </div>
        <form id="resetform"class="form" action="#" method="post" novalidate>
        {% csrf_token %}
          <label class="label" for="email">Email Address</label>
          <div class="field">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="email" name="email" type="email" placeholder="yourname@example.com" autocomplete="email" required/>
          </div>
           <div id="alert-msg"></div>
          <button class="btn" type="submit">Send Reset Link</button>
          <div class="sep"></div>
          <p class="meta">Remember your password? <a class="link" href="{% url 'login' %}">Login</a></p>
        </form>
      </div>
    </section>
  </div>
</body>
<script src="{% static 'js/password_render.js' %}"> </script>
</script>
</html>
